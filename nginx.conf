# www → no-www. Traefik reenvía la cabecera Host, así que esto se resuelve aquí y
# no en Coolify. Conserva ruta y consulta; `https://` va fijo porque, tras el
# proxy, nginx solo ve http.
server {
    listen 80;
    server_name www.elementoweb.com;
    server_tokens off;
    include /etc/nginx/snippets/security.conf;
    return 301 https://elementoweb.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects de directorio (/servicios → /servicios/) con Location relativa:
    # tras el proxy nginx solo ve http:// y, en absoluto, mandaba al visitante a
    # http://… antes de que el proxy lo subiera a https con un segundo salto.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    include /etc/nginx/snippets/security.conf;

    # Compresión
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Assets con hash de Astro → caché inmutable de 1 año
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security.conf;
        access_log off;
    }

    # Demos de PROSPECTOS: viven en un volumen del servidor, no en el repo (que es
    # público y guarda historial). Las sube y borra scripts/demo-prospecto.mjs.
    # `^~` gana a la regex de abajo; sin él, /demo/p/x se buscaría dentro de la
    # imagen y daría 404. Montaje en Coolify: /data/elementoweb/demos-prospectos
    # → /srv/demos-prospectos (solo lectura).
    location ^~ /demo/p/ {
        alias /srv/demos-prospectos/;
        try_files $uri $uri/ =404;
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security.conf;
    }

    # Documentos de cliente: no se indexan aunque alguien los enlace (robots.txt
    # solo impide rastrear; esto cubre también PDFs, imágenes y HTML futuros).
    # No sustituye a una autenticación.
    location ~ ^/(demo|propuestas|presentaciones|hackathon)/ {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=600";
        include /etc/nginx/snippets/security.conf;
    }

    # Imágenes, fuentes, íconos y videos → 30 días. Un video regenerado cambia de nombre (-v2) para no servir la copia vieja.
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security.conf;
        access_log off;
    }

    # Redirects 301: URLs retiradas → su continuación actual.
    # crecimiento/mantenimiento-hosting-web-panama se separó en dos páginas
    # propias (mantenimiento-web-panama y hosting-infraestructura-panama);
    # la vieja URL apunta a la de mantenimiento por tener más enlaces
    # internos y ser la continuación más directa del contenido original.
    # llms.txt, llms-full.txt, robots.txt y los sitemaps van en UTF-8 (tildes y eñes):
    # sin esto salen como text/plain sin charset y algunos lectores los muestran mal.
    charset utf-8;
    # Astro publica el sitemap como /sitemap-index.xml; /sitemap.xml es la dirección que
    # prueban por defecto los rastreadores y herramientas de SEO.
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }
    location = /crecimiento/mantenimiento-hosting-web-panama {
        return 301 /crecimiento/mantenimiento-web-panama/;
    }
    location = /crecimiento/mantenimiento-hosting-web-panama/ {
        return 301 /crecimiento/mantenimiento-web-panama/;
    }
    # Renombres de producto que no dejaron redirección (6e0c1ff ChatMantis → WazaCRM, 408f1c9 WapyCRM → NousCRM).
    # Search Console aún las mostraba en octubre de 2026 (audit/gsc-baseline-2026-10.md, hallazgo 5).
    # Misma forma que el 301 de mantenimiento de arriba (coincidencia exacta, con y sin barra final).
    location = /saas/chatmantis {
        return 301 /saas/wazacrm/;
    }
    location = /saas/chatmantis/ {
        return 301 /saas/wazacrm/;
    }
    location = /funcionalidades/chatbots-ia-web-chatmantis-panama {
        return 301 /funcionalidades/chatbots-ia-web-wazacrm-panama/;
    }
    location = /funcionalidades/chatbots-ia-web-chatmantis-panama/ {
        return 301 /funcionalidades/chatbots-ia-web-wazacrm-panama/;
    }
    location = /saas/wapycrm {
        return 301 /saas/nouscrm/;
    }
    location = /saas/wapycrm/ {
        return 301 /saas/nouscrm/;
    }

    # HTML y páginas → caché corta (para reflejar cambios en cada deploy)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=600";
        include /etc/nginx/snippets/security.conf;
    }

    error_page 404 /404.html;
}
