# Cabeceras de seguridad. En nginx, un add_header dentro de un `location`
# REEMPLAZA a los del `server`, por eso este archivo se incluye en cada bloque.
# El redirect http→https lo hace Traefik/Coolify (307) y a nginx solo le llegan
# peticiones que ya vinieron por https; por eso HSTS puede ponerse aquí. El
# redirect de www sí vive en nginx.conf (Traefik reenvía el Host).
#
# HSTS: 1 día para empezar; subir a 1 año cuando pase un día sin problemas (el
# certificado vence el 15/11/2026). SIN includeSubDomains ni preload: mail,
# cpanel y app.elementoweb.com viven en otros servidores.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP en modo SOLO REPORTE: no bloquea nada, solo avisa en la consola del navegador
# (DevTools > Consola) de lo que una política estricta rechazaría. Revisar unas semanas
# antes de pasarla a Content-Security-Policy. 'unsafe-inline' es necesario hoy por los
# scripts/estilos en línea de Astro; el paso siguiente sería usar hashes.
# Orígenes: GA4/Tag Manager (analítica), n8n (envío del formulario).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://n8n.aiwebstudio.co https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
