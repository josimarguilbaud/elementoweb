# Cabeceras de seguridad. En nginx, un add_header dentro de un `location`
# REEMPLAZA a los del `server`, por eso este archivo se incluye en cada bloque.
# HSTS y el redirect http→https/www se configuran en Coolify/Traefik (nginx solo
# ve HTTP). CSP: pendiente, primero en Report-Only tras medir el sitio.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
