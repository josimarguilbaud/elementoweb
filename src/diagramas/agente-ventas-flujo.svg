<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="agente-ventas-flujo-title agente-ventas-flujo-desc" font-family="Roboto, system-ui, sans-serif">
  <title id="agente-ventas-flujo-title">Qué hace el agente con cada mensaje</title>
  <desc id="agente-ventas-flujo-desc">El cliente escribe por WhatsApp o Instagram y el agente responde con tu información aprobada; si el precio o el caso están aprobados cotiza y agenda, si no pasa la conversación a una persona, y todo queda registrado en WazaCRM.</desc>
