  <text x="200" y="233" fill="#0a0a0a" font-size="13" font-weight="700" text-anchor="middle">aprobado?</text>
  <rect x="16" y="288" width="144" height="64" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="88" y="317" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Cotiza y agenda</text>
  <text x="88" y="336" fill="#525252" font-size="13" text-anchor="middle">con tus precios</text>
  <rect x="240" y="288" width="144" height="64" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
