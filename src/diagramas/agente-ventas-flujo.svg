  <text x="200" y="45" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Cliente escribe</text>
  <rect x="100" y="96" width="200" height="56" rx="8" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="200" y="121" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">El agente responde</text>
  <text x="200" y="140" fill="#d4d4d4" font-size="13" text-anchor="middle">con tu información aprobada</text>
