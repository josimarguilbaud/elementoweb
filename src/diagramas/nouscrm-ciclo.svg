<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" role="img" aria-labelledby="nouscrm-ciclo-title nouscrm-ciclo-desc" font-family="Roboto, system-ui, sans-serif">
  <title id="nouscrm-ciclo-title">De la cotización al cobro con NousCRM</title>
  <desc id="nouscrm-ciclo-desc">La cotización se hace con tu logo, se convierte en factura con un clic, los abonos actualizan el saldo solos y la lista de cobros pendientes dice quién te debe; después viene la siguiente venta.</desc>
  <defs><marker id="flecha" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#737373"/></marker></defs>
  <path d="M276 72 V102" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M276 160 V190" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M276 248 V278" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M168 308 H72 Q64 308 64 300 V52 Q64 44 72 44 H166" fill="none" stroke="#737373" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <rect x="71" y="170" width="84" height="17" fill="#fff"/>
  <text x="76" y="182" fill="#737373" font-size="11" font-weight="500" letter-spacing="0.08em" text-anchor="start">OTRA VENTA</text>
  <rect x="168" y="16" width="216" height="56" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="276" y="41" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Cotización</text>
  <text x="276" y="60" fill="#525252" font-size="13" text-anchor="middle">con tu logo</text>
  <rect x="168" y="104" width="216" height="56" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="276" y="129" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Factura</text>
  <text x="276" y="148" fill="#525252" font-size="13" text-anchor="middle">con un clic</text>
  <rect x="168" y="192" width="216" height="56" rx="8" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="276" y="217" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Abonos</text>
  <text x="276" y="236" fill="#d4d4d4" font-size="13" text-anchor="middle">el saldo se calcula solo</text>
  <rect x="168" y="280" width="216" height="56" rx="8" fill="#f5f5f5" stroke="#737373" stroke-width="1.5"/>
  <text x="276" y="305" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Cobros pendientes</text>
  <text x="276" y="324" fill="#525252" font-size="13" text-anchor="middle">lista de quién te debe</text>
</svg>
