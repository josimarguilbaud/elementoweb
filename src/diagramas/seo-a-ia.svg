<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" role="img" aria-labelledby="seo-a-ia-title seo-a-ia-desc" font-family="Roboto, system-ui, sans-serif">
  <title id="seo-a-ia-title">De tu web a Google y a la respuesta de la IA</title>
  <desc id="seo-a-ia-desc">Tu web es rastreada por los índices de búsqueda; de esos índices salen tanto los resultados de Google como las respuestas de asistentes de IA, y ambos llevan al cliente hasta tu negocio.</desc>
  <defs><marker id="flecha" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#737373"/></marker></defs>
  <path d="M200 80 V126" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <rect x="207" y="96" width="69.2" height="17" fill="#fff"/>
  <text x="212" y="108" fill="#737373" font-size="11" font-weight="500" letter-spacing="0.08em" text-anchor="start">RASTREAN</text>
  <path d="M160 192 V216 Q160 224 152 224 H108 Q100 224 100 232 V254" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M240 192 V216 Q240 224 248 224 H292 Q300 224 300 232 V254" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M100 328 V352 Q100 360 108 360 H152 Q160 360 160 368 V382" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M300 328 V352 Q300 360 292 360 H248 Q240 360 240 368 V382" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <rect x="100" y="16" width="200" height="64" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="200" y="45" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Tu web</text>
  <text x="200" y="64" fill="#525252" font-size="13" text-anchor="middle">páginas claras y verificables</text>
  <rect x="100" y="128" width="200" height="64" rx="8" fill="#f5f5f5" stroke="#737373" stroke-width="1.5"/>
  <text x="200" y="157" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Índices de búsqueda</text>
  <text x="200" y="176" fill="#525252" font-size="13" text-anchor="middle">Google, Bing y otros</text>
  <rect x="16" y="256" width="168" height="72" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="100" y="289" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Resultados de Google</text>
  <text x="100" y="308" fill="#525252" font-size="13" text-anchor="middle">enlaces y mapa</text>
  <rect x="216" y="256" width="168" height="72" rx="8" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="300" y="289" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Respuestas de IA</text>
  <text x="300" y="308" fill="#d4d4d4" font-size="13" text-anchor="middle">ChatGPT, Gemini y otros</text>
  <rect x="100" y="384" width="200" height="56" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="200" y="409" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Tu cliente</text>
  <text x="200" y="428" fill="#525252" font-size="13" text-anchor="middle">te llama o te escribe</text>
</svg>
