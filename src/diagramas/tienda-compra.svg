<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-labelledby="tienda-compra-title tienda-compra-desc" font-family="Roboto, system-ui, sans-serif">
  <title id="tienda-compra-title">El camino de una compra en tu tienda online</title>
  <desc id="tienda-compra-desc">El cliente llega desde una búsqueda o un anuncio a la ficha del producto, lo agrega al carrito, paga con Yappy o tarjeta y recibe la confirmación del pedido por correo y WhatsApp.</desc>
  <defs><marker id="flecha" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#737373"/></marker></defs>
  <path d="M200 64 V94" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M200 152 V182" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M200 232 V262" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <path d="M200 320 V350" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#flecha)"/>
  <rect x="100" y="16" width="200" height="48" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="200" y="45" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Búsqueda o anuncio</text>
  <rect x="100" y="96" width="200" height="56" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="200" y="121" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Ficha de producto</text>
  <text x="200" y="140" fill="#525252" font-size="13" text-anchor="middle">fotos, precio y envío</text>
  <rect x="100" y="184" width="200" height="48" rx="8" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="200" y="213" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Carrito</text>
  <rect x="100" y="264" width="200" height="56" rx="8" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="200" y="289" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Pago</text>
  <text x="200" y="308" fill="#d4d4d4" font-size="13" text-anchor="middle">Yappy o tarjeta</text>
  <rect x="100" y="352" width="200" height="56" rx="8" fill="#f5f5f5" stroke="#737373" stroke-width="1.5"/>
  <text x="200" y="377" fill="#0a0a0a" font-size="16" font-weight="700" text-anchor="middle">Pedido confirmado</text>
  <text x="200" y="396" fill="#525252" font-size="13" text-anchor="middle">aviso por correo y WhatsApp</text>
</svg>
